<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="WindPlay 网页创意作品启动台">
  <title>WindPlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="WindPlay 首页">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span>WindPlay</span>
    </a>
    <div class="edition">
      <span class="status-dot" aria-hidden="true"></span>
      <span>01 WORK</span>
    </div>
  </header>

  <main>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <p class="kicker">WEB EXPERIMENTS / 2026</p>
          <h1 id="catalog-title">选择一个作品</h1>
        </div>
        <p class="catalog-note">点云、粒子、交互艺术与小游戏</p>
      </div>

      <div class="work-grid">
        <a class="work-card" href="works/point-cloud-studio/demo/index.html" target="_blank" rel="noopener">
          <figure class="work-preview">
            <img src="assets/point-cloud-studio-preview.png" alt="彩色点阵人像预览" width="1600" height="1600">
            <span class="work-number" aria-hidden="true">01</span>
          </figure>
          <div class="work-content">
            <div class="work-meta">
              <span>INTERACTIVE PORTRAIT</span>
              <span>CANVAS / SVG</span>
            </div>
            <h2>Point Cloud Studio</h2>
            <p>把照片转换成彩色点阵与可旋转、缩放、扰动的三维点云。</p>
            <span class="launch">打开作品 <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <span>WINDPLAY</span>
    <span>EXPLORE THROUGH PLAY</span>
  </footer>
</body>
</html>
