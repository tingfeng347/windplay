<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在本地将照片转成点阵与三维点云，调节纵深并导出纯画面的交互 HTML、SVG 或 PNG。">
  <title>点云照片 · WindPlay</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0c0c0b;
  --surface: #141412;
  --raised: #1b1b18;
  --line: rgba(243, 241, 236, 0.1);
  --line-strong: rgba(243, 241, 236, 0.2);
  --text: #f3f1ec;
  --muted: #9b988e;
  --faint: #6d6b64;
  --accent: #ff5a3c;
  --accent-ink: #1a0b07;
  --accent-soft: rgba(255, 90, 60, 0.14);
  --track: rgba(243, 241, 236, 0.14);
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 24px 60px -30px rgba(0, 0, 0, 0.8);
  --error: #ff9d8f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f0e9;
  --surface: #fffefa;
  --raised: #f7f5ee;
  --line: #dedacf;
  --line-strong: #c9c6bb;
  --text: #171715;
  --muted: #68675f;
  --faint: #9a988f;
  --accent: #e2472b;
  --accent-ink: #fff8f5;
  --accent-soft: rgba(226, 71, 43, 0.1);
  --track: #e2ded3;
  --shadow: 0 1px 2px rgba(23, 23, 21, 0.04), 0 24px 50px -32px rgba(23, 23, 21, 0.35);
  --error: #b42b20;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  font-synthesis: none;
  transition: background-color 240ms ease, color 240ms ease;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:disabled,
input:disabled {
  cursor: default;
  opacity: 0.4;
}

/* 仅作用于按钮与链接里的图标；画布中的点阵 SVG 不能继承描边。 */
:where(button, a) > svg {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── 顶栏 ─────────────────────────────────────────────── */

.topbar {
  height: 64px;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid var(--line);
}

.back-link {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px 7px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font: 600 12px/1 var(--mono);
  letter-spacing: 0.08em;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 160ms ease, border-color 160ms ease;
}

.back-link:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  white-space: nowrap;
}

.work-number {
  align-self: center;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font: 700 11px/1 var(--mono);
}

h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.eyebrow {
  color: var(--muted);
  font: 600 11px/1 var(--mono);
  letter-spacing: 0.16em;
}

.theme-toggle {
  justify-self: end;
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}

.theme-toggle button {
  height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  transition: background-color 160ms ease, color 160ms ease;
}

.theme-toggle button:hover {
  color: var(--text);
}

.theme-toggle button[aria-pressed="true"] {
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
}

/* ── 工作区 ───────────────────────────────────────────── */

.workspace {
  max-width: 1760px;
  margin: 0 auto;
  padding: 20px 24px 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 20px;
  align-items: start;
}

.viewer {
  position: sticky;
  top: 20px;
  min-width: 0;
  margin: 0;
}

/* 画布是“暗房”：无论界面主题如何，背景都由点云配色决定。 */
.stage {
  --stage-ink: 243, 241, 236;
  position: relative;
  height: clamp(360px, calc(100svh - 150px), 1040px);
  overflow: hidden;
  border-radius: 16px;
  background: #100f0b;
  box-shadow: var(--shadow);
  isolation: isolate;
}

.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 1px solid rgba(var(--stage-ink), 0.1);
  border-radius: inherit;
  pointer-events: none;
}

.stage.dragging::after {
  border: 2px dashed var(--accent);
  background: rgba(0, 0, 0, 0.25);
}

#preview {
  width: 100%;
  height: 100%;
  line-height: 0;
}

/* 有脚本时先隐藏构建期的静态点阵，等示例照片解码、点云就绪后再淡入。 */
.stage.loading #preview {
  opacity: 0;
}

#preview {
  transition: opacity 420ms ease;
}

.stage.loading::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 2;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border: 2px solid rgba(var(--stage-ink), 0.18);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 800ms linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#preview svg,
#preview canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* SVG 自带的背景矩形与画布同色；隐藏它可避免缩放后在边缘露出一道细缝。 */
#preview svg > rect {
  fill: transparent;
}

#preview canvas {
  touch-action: none;
}

.hud {
  position: absolute;
  inset: 18px;
  z-index: 2;
  pointer-events: none;
  color: rgba(var(--stage-ink), 0.55);
  font: 600 11px/1 var(--mono);
  letter-spacing: 0.12em;
}

.corner {
  position: absolute;
  width: 18px;
  height: 18px;
  border-color: rgba(var(--stage-ink), 0.35);
  border-style: solid;
  border-width: 0;
}

.corner.tl { top: 0; left: 0; border-top-width: 1.5px; border-left-width: 1.5px; }
.corner.tr { top: 0; right: 0; border-top-width: 1.5px; border-right-width: 1.5px; }
.corner.bl { bottom: 0; left: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.corner.br { bottom: 0; right: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; }

.hud-text {
  position: absolute;
  top: 6px;
  max-width: 45%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hud-tl { left: 30px; }
.hud-tl b { color: var(--accent); font-weight: 700; }
.hud-tr { right: 30px; font-variant-numeric: tabular-nums; }

.stage-tools {
  position: absolute;
  left: 50%;
  bottom: 18px;
  z-index: 2;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  background: rgba(16, 15, 12, 0.72);
  backdrop-filter: blur(14px) saturate(1.3);
  color: #f3f1ec;
  font-size: 13px;
  white-space: nowrap;
}

.segmented {
  display: flex;
  gap: 2px;
}

.segmented button,
.tool-button {
  height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: rgba(243, 241, 236, 0.66);
  transition: background-color 160ms ease, color 160ms ease;
}

.segmented button:hover,
.tool-button:hover:not(:disabled) {
  color: #f3f1ec;
  background: rgba(255, 255, 255, 0.08);
}

.segmented button[aria-pressed="true"] {
  background: #f3f1ec;
  color: #141412;
  font-weight: 600;
}

.stage-tools .tool-button {
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 0 8px 8px 0;
}

.drop-hint {
  position: absolute;
  inset: 0;
  z-index: 3;
  margin: 0;
  display: grid;
  place-items: center;
  color: #fff;
  font: 600 14px/1 var(--mono);
  letter-spacing: 0.12em;
  pointer-events: none;
}

.drop-hint[hidden] {
  display: none;
}

figcaption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 4px 0;
  color: var(--muted);
  font: 500 12px/1.4 var(--mono);
  letter-spacing: 0.04em;
}

#stats {
  font-variant-numeric: tabular-nums;
}

/* ── 检查器 ───────────────────────────────────────────── */

.inspector {
  position: sticky;
  top: 20px;
  max-height: calc(100svh - 104px);
  overflow-y: auto;
  padding: 4px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.block {
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.block:last-child {
  border-bottom: 0;
}

.block-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.index {
  color: var(--accent);
  font: 700 11px/1 var(--mono);
  letter-spacing: 0.08em;
}

.text-button {
  padding: 4px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  transition: color 160ms ease;
}

.text-button:hover {
  color: var(--accent);
}

.file-input {
  display: none;
}

.dropzone {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  background: var(--raised);
  text-align: left;
  transition: border-color 160ms ease, background-color 160ms ease;
}

.dropzone:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.dropzone svg {
  width: 26px;
  height: 26px;
  padding: 5px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  stroke-width: 2;
}

.dropzone b {
  display: block;
  font-size: 14px;
  font-weight: 600;
}

.dropzone small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.source {
  margin: 10px 0 0;
  overflow: hidden;
  color: var(--muted);
  font: 500 12px/1.5 var(--mono);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.control {
  margin-bottom: 14px;
}

.label-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
  font-size: 13px;
}

output {
  flex: none;
  min-width: 42px;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--raised);
  color: var(--text);
  font: 600 12px/1.6 var(--mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

input[type="range"] {
  --fill: 50%;
  display: block;
  width: 100%;
  height: 20px;
  margin: 0;
  background: transparent;
  appearance: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--fill), var(--track) var(--fill));
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: var(--track);
}

input[type="range"]::-moz-range-progress {
  height: 4px;
  border-radius: 2px;
  background: var(--accent);
}

input[type="range"]::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border: 3px solid var(--surface);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 2px 6px rgba(0, 0, 0, 0.25);
  appearance: none;
  transition: transform 120ms ease;
}

input[type="range"]::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border: 3px solid var(--surface);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

input[type="range"]:active::-webkit-slider-thumb {
  transform: scale(1.15);
}

input[type="range"]:disabled {
  cursor: default;
}

.switches {
  display: grid;
  gap: 4px;
  margin-bottom: 14px;
}

.switches:last-child {
  margin-bottom: 0;
}

.switch {
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  cursor: pointer;
}

/* 复选框外观改为开关：旋钮用径向渐变绘制，不依赖伪元素。 */
.switch input {
  flex: none;
  width: 34px;
  height: 20px;
  margin: 0;
  border-radius: 10px;
  background: radial-gradient(circle at 10px 50%, #fff 6.5px, transparent 7px), var(--line-strong);
  appearance: none;
  cursor: pointer;
  transition: background 180ms ease;
}

.switch input:checked {
  background: radial-gradient(circle at 24px 50%, #fff 6.5px, transparent 7px), var(--accent);
}

.colors {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.swatch {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raised);
  font-size: 13px;
  cursor: pointer;
}

input[type="color"] {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: none;
  cursor: pointer;
  appearance: none;
}

input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

input[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: 50%;
}

input[type="color"]::-moz-color-swatch {
  border: 0;
  border-radius: 50%;
}

.exports {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  transition: background-color 160ms ease, border-color 160ms ease, filter 160ms ease;
}

.button:hover:not(:disabled) {
  background: var(--raised);
}

.primary {
  grid-column: 1 / -1;
  min-height: 44px;
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}

.primary:hover:not(:disabled) {
  background: var(--accent);
  filter: brightness(1.08);
}

.note {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

#status {
  min-height: 18px;
  margin: 10px 0 0;
  color: var(--accent);
  font-size: 12px;
  overflow-wrap: anywhere;
}

#status[data-error="true"] {
  color: var(--error);
}

.noscript {
  padding: 20px;
}

@media (max-width: 1100px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 16px;
    padding: 16px;
  }

  .topbar {
    padding: 0 16px;
  }

  .eyebrow {
    display: none;
  }
}

@media (max-width: 860px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
  }

  .viewer,
  .inspector {
    position: static;
  }

  .inspector {
    max-height: none;
  }

  .stage {
    height: min(68svh, 640px);
    min-height: 320px;
  }
}

@media (max-width: 560px) {
  .topbar {
    grid-template-columns: auto 1fr auto;
    gap: 10px;
  }

  .back-link span,
  .theme-toggle span,
  .tool-button span,
  .hud-tr {
    display: none;
  }

  .title {
    justify-self: center;
  }

  .stage {
    height: min(62svh, 520px);
    border-radius: 12px;
  }

  .segmented button {
    padding: 0 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../../../index.html" aria-label="返回 WindPlay 启动台">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>WindPlay</span>
    </a>
    <div class="title">
      <span class="work-number" aria-hidden="true">01</span>
      <h1>点云照片</h1>
      <span class="eyebrow">照片转点云</span>
    </div>
    <div class="theme-toggle" role="group" aria-label="界面主题">
      <button id="themeLight" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg><span>亮色</span>
      </button>
      <button id="themeDark" type="button" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg><span>暗色</span>
      </button>
    </div>
  </header>

  <main class="workspace">

        context.beginPath(); context.arc(x, y, p.r, 0, Math.PI * 2); context.fill();
      }
      return moving;
    }

    function render(time) {
      frame = 0;
      if (disposed || doc.hidden) { lastTime = 0; return; }
      const factor = reduced.matches ? 1 : 1 - Math.exp(-Math.min(40, time - (lastTime || time - 16)) / 70);
      lastTime = time;
      const parallax = scene.threeD && scene.interactive && pointer.active && !drag;
      const desired = {
        yaw: target.yaw + (parallax ? pointer.nx * 0.16 : 0),
        pitch: target.pitch - (parallax ? pointer.ny * 0.12 : 0), zoom: target.zoom
      };
      let moving = false;
      for (const key of ['yaw', 'pitch', 'zoom']) {
        camera[key] += (desired[key] - camera[key]) * factor;
        if (Math.abs(desired[key] - camera[key]) < 0.0001) camera[key] = desired[key];
        else moving = true;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      moving = paint(ctx, size, camera, true, factor) || moving;
      if (moving) frame = win.requestAnimationFrame(render);
      else lastTime = 0;
    }
    function wake() { if (!disposed && !frame && !doc.hidden) frame = win.requestAnimationFrame(render); }
    function release() {
      if (drag && canvas.hasPointerCapture(drag.id)) canvas.releasePointerCapture(drag.id);
      drag = null; canvas.style.cursor = scene.threeD ? 'grab' : 'default';
    }
    function leave() { pointer.active = false; pointer.nx = 0; pointer.ny = 0; wake(); }
    function resize() {
      const bounds = canvas.getBoundingClientRect();
      size.width = Math.max(1, bounds.width); size.height = Math.max(1, bounds.height);
      dpr = Math.min(2, win.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(size.width * dpr));
      canvas.height = Math.max(1, Math.round(size.height * dpr));
      offsets.forEach(off => { off.x = 0; off.y = 0; });
      leave();
    }
    function locate(event) {
      const box = canvas.getBoundingClientRect();
      pointer.x = event.clientX - box.left; pointer.y = event.clientY - box.top;
      pointer.nx = Math.max(-1, Math.min(1, pointer.x / size.width * 2 - 1));
      pointer.ny = Math.max(-1, Math.min(1, pointer.y / size.height * 2 - 1));
      pointer.active = true;
    }
    function move(event) {
      if (drag && event.pointerId !== drag.id) return;
      locate(event);
      if (drag && scene.threeD) {
        target.yaw += (event.clientX - drag.x) * 0.006;
        // 屏幕 Y 向下：下拖减小俯仰角，让近处的点跟随鼠标向下。
        target.pitch = Math.max(-1.15, Math.min(1.15, target.pitch - (event.clientY - drag.y) * 0.006));
        drag.x = event.clientX; drag.y = event.clientY;
      }
      wake();
    }
    function down(event) {
      if (!scene.threeD || drag || event.button !== 0) return;
      canvas.focus({ preventScroll: true }); locate(event);
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId); canvas.style.cursor = 'grabbing'; wake();
    }
    function up(event) {
      if (!drag || event.pointerId !== drag.id) return;
      release(); leave();
    }
    function cancel() { release(); leave(); }
    function wheel(event) {
      if (!scene.threeD) return;
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? size.height : 1);
      target.zoom = Math.max(0.55, Math.min(2.5, target.zoom * Math.exp(-delta * 0.001)));
      wake();
    }
    function resetView() { Object.assign(target, initial); release(); leave(); }
    function key(event) {
      if (!scene.threeD) return;
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home','r','R'].includes(event.key)) event.preventDefault();
      else return;
      if (event.key === 'ArrowLeft') target.yaw -= 0.1;
      if (event.key === 'ArrowRight') target.yaw += 0.1;
      if (event.key === 'ArrowUp') target.pitch = Math.min(1.15, target.pitch + 0.1);
      if (event.key === 'ArrowDown') target.pitch = Math.max(-1.15, target.pitch - 0.1);
      if (event.key === '+' || event.key === '=') target.zoom = Math.min(2.5, target.zoom * 1.1);
      if (event.key === '-') target.zoom = Math.max(0.55, target.zoom / 1.1);
      if (['Home','r','R'].includes(event.key)) resetView();
      wake();
    }
    function visibility() {
      if (doc.hidden) {
        win.cancelAnimationFrame(frame); frame = 0; lastTime = 0;
        release(); pointer.active = false; pointer.nx = 0; pointer.ny = 0;
        offsets.forEach(off => { off.x = 0; off.y = 0; });
        Object.assign(camera, target);
      } else wake();
    }
    const events = [
      [canvas,'pointermove',move],[canvas,'pointerdown',down],[canvas,'pointerup',up],
      [canvas,'pointerleave',leave],[canvas,'pointercancel',cancel],
      [canvas,'lostpointercapture',cancel],[canvas,'dblclick',resetView],
      [canvas,'wheel',wheel,{passive:false}],[canvas,'keydown',key],
      [win,'blur',cancel],[win,'pagehide',cancel],[win,'pageshow',wake],
      [doc,'visibilitychange',visibility]
    ];
    events.forEach(([el,type,fn,opts]) => el.addEventListener(type,fn,opts));
    canvas.style.cursor = scene.threeD ? 'grab' : 'default';
    const observer = new win.ResizeObserver(resize);
    observer.observe(canvas); resize();
    return {
      getView: () => ({ ...target }),
      reset: resetView,
      snapshot: (scale = 2) => {
        const result = doc.createElement('canvas');
        result.width = Math.round(scene.width * scale); result.height = Math.round(scene.height * scale);
        const context = result.getContext('2d');
        if (!context) throw new Error('无法导出点云图像。');
        paint(context, {width:result.width,height:result.height}, target, false);
        return result;
      },
      destroy: () => {
        disposed = true; win.cancelAnimationFrame(frame); observer.disconnect();
        events.forEach(([el,type,fn,opts]) => el.removeEventListener(type,fn,opts));
        release();
      }
    };
  }

  /** 导出的 HTML 只包含点云画面、点坐标与交互运行时，没有编辑器或原照片。 */
  function toHTML(model, input = {}) {
    const scene = prepare(model, input);
    const payload = JSON.stringify(scene).replace(/</g, '\\u003c');
    const label = scene.threeD ? '三维点云：移动鼠标扰动，拖拽旋转，滚轮缩放，双击复位。' : '点阵人像：移动鼠标可产生扰动。';
    const code = '(' + mount.toString() + ')(document.getElementById("cloud"),' + payload + ',' + project.toString() + ');';
    return '<!doctype html>\n<html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>交互点云</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:' + scene.background + '}' +
      'canvas{display:block;width:100%;height:100%;touch-action:none;border:0;outline:none;box-shadow:none}' +
      'canvas:focus,canvas:focus-visible{border:0;outline:none;box-shadow:none}' +
      'noscript{position:fixed;inset:0;display:grid;place-items:center;color:' + scene.foreground + '}</style></head><body>' +
      '<canvas id="cloud" tabindex="0" role="img" aria-label="' + label + '"></canvas>' +
      '<noscript>请启用 JavaScript 以显示交互点云。</noscript>' +
      '<scr' + 'ipt>\n' + code + '\n</scr' + 'ipt></body></html>';
  }

  return Object.freeze({ prepare, project, mount, toHTML });
});

    sourceColors:$('sourceColors').checked } };
  showModel();
}
function defaultColors() {
  for (const key of ['foreground','background']) $(key).value = ART[key];
  recolor();
}
const setVar = (el, name, value) => { if (el.style.setProperty) el.style.setProperty(name, value); };
/** 画布上的 HUD 随背景明暗选择浅色或深色描边。 */
function stageInk(hex) {
  const n = parseInt(hex.slice(1), 16);
  const light = (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
  return light > 0.55 ? '21,21,19' : '243,241,236';
}
function updateView() {
  if (!$('threeD').checked || !cloud) { $('hudView').textContent = '平面点阵 · 1:1'; return; }
  const view = cloud.getView();
  const degrees = radians => { const d = Math.round(radians * 180 / Math.PI) % 360; return d > 180 ? d - 360 : d < -180 ? d + 360 : d; };
  const sign = n => n < 0 ? '−' + Math.abs(n) : String(n);
  $('hudView').textContent = `YAW ${sign(degrees(view.yaw))}° · PITCH ${sign(degrees(view.pitch))}° · ${Math.round(view.zoom * 100)}%`;
}
function setTheme(name, persist = true) {
  currentTheme = name === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = currentTheme;
  $('themeLight').setAttribute('aria-pressed', String(currentTheme === 'light'));
  $('themeDark').setAttribute('aria-pressed', String(currentTheme === 'dark'));
  if (persist) {
    try { window.localStorage.setItem('point-cloud-editor-theme', currentTheme); } catch (_) {}
  }
}
function status(message, error = false) {
  $('status').textContent = message; $('status').dataset.error = String(error);
}
function config() {
  const values = { width:800, autoLevels:$('autoLevels').checked, invert:$('invert').checked,
    foreground:$('foreground').value, background:$('background').value,
    sourceColors:$('sourceColors').checked };
  sliders.forEach(key => { values[key] = Number($(key).value); });
  return values;
}
function syncLabels() {
  sliders.forEach(key => { $(key + 'Value').value = Number($(key).value).toFixed(key === 'spacing' ? 1 : 2); });
  $('depthValue').value = Number($('depth').value).toFixed(2);
  $('depth').disabled = !$('threeD').checked;
  $('resetView').disabled = !$('threeD').checked;
  $('foreground').disabled = $('sourceColors').checked;
  $('mode2d').setAttribute('aria-pressed', String(!$('threeD').checked));
  $('mode3d').setAttribute('aria-pressed', String($('threeD').checked));
  for (const key of [...sliders, 'depth']) {
    const el = $(key), min = Number(el.min || 0), max = Number(el.max || 1);
    setVar(el, '--fill', `${((Number(el.value) - min) / (max - min || 1) * 100).toFixed(1)}%`);
  }
}
function setInteraction() {
  if ($('threeD').checked) { showModel(); return; }
  if (destroyMotion) { destroyMotion(); destroyMotion = null; }
  if ($('motion').checked && currentModel) {
    destroyMotion = Halftone.interact($('preview').querySelector('svg'), currentModel);
  }
}
function cloudOptions() {
  return { threeD:$('threeD').checked, depth:Number($('depth').value),
    view:$('threeD').checked ? (cloud ? cloud.getView() : savedView || undefined) : {yaw:0,pitch:0,zoom:1}, interactive:true };
}
function showModel() {
  if (!currentModel) return;
  if (cloud) { savedView = cloud.getView(); cloud.destroy(); cloud = null; }
  if (destroyMotion) { destroyMotion(); destroyMotion = null; }
  const stage = $('stage');
  stage.style.background = currentModel.config.background;
  setVar(stage, '--stage-ink', stageInk(currentModel.config.background));
  if ($('threeD').checked) {
    const canvas = document.createElement('canvas');
    canvas.width = currentModel.width; canvas.height = currentModel.height;
    canvas.style.aspectRatio = `${currentModel.width} / ${currentModel.height}`;
    canvas.tabIndex = 0; canvas.setAttribute('role','img');
    canvas.setAttribute('aria-label','三维点云，拖拽旋转，滚轮缩放，双击复位');
    $('preview').replaceChildren(canvas);
    cloud = PointCloud.mount(canvas, PointCloud.prepare(currentModel, {
      ...cloudOptions(), interactive:$('motion').checked
    }));
  } else {
    $('preview').innerHTML = Halftone.toSVG(currentModel, { interactive:false });
    if ($('motion').checked) destroyMotion = Halftone.interact($('preview').querySelector('svg'), currentModel);
  }
  $('gestureHint').textContent = $('threeD').checked ? '拖拽旋转 · 滚轮缩放 · 双击复位' : '移动鼠标扰动 · 移开自动回位';
  stage.classList?.remove('loading');
  $('stats').textContent = `${currentModel.dots.length.toLocaleString('zh-CN')} 点 · ${$('threeD').checked ? '3D' : '2D'} · 纵深 ${Number($('depth').value).toFixed(2)}`;
  updateView();
}
function render() {
  renderFrame = 0;
  if (!currentImage) return;
  try {
    const model = Halftone.fromImage(currentImage, config());
    currentModel = model;
    showModel();
  } catch (error) { status('生成失败：' + error.message, true); }
}
function schedule() { syncLabels(); if (!renderFrame) renderFrame = requestAnimationFrame(render); }
function loadImage(src, label, ticket) {
  const img = new Image();
  img.onload = () => {
    if (ticket !== loadTicket) return;
    if (img.naturalWidth * img.naturalHeight > 50000000) {
      status('照片过大，请先缩小到 5000 万像素以内。', true); return;
    }
    currentImage = img; $('source').textContent = '当前：' + label; $('hudSource').textContent = label;
    status(''); render();
  };
  img.onerror = () => { if (ticket === loadTicket) status('无法读取照片，请使用 JPG、PNG 或 WebP。', true); };
  img.src = src;
}
function loadSample() { loadImage(SAMPLE, '彩色示例人像', ++loadTicket); }
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
// 导出从原始坐标开始；SVG 内嵌扰动脚本，PNG 保存静态图。
function flush() { if (renderFrame) { cancelAnimationFrame(renderFrame); render(); } return currentModel; }

function openFile(file) {
  const ticket = ++loadTicket;
  if (file.size > 20 * 1024 * 1024) { status('请选择小于 20 MB 的照片。', true); return; }
  if (!/^image\/(jpeg|png|webp|avif)$/.test(file.type)) { status('请使用 JPG、PNG、WebP 或 AVIF 照片。', true); return; }
  status('正在读取照片…');
  const reader = new FileReader();
  reader.onload = () => { if (ticket === loadTicket) loadImage(reader.result, file.name, ticket); };
  reader.onerror = () => { if (ticket === loadTicket) status('读取失败，请重新选择照片。', true); };
  reader.readAsDataURL(file);
}
$('choose').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', event => {
  const file = event.target.files[0]; if (!file) return;
  openFile(file); event.target.value = '';
});
// 照片可以直接拖到画布上。
let dragDepth = 0;
const dragging = on => { $('stage').classList?.toggle('dragging', on); $('dropHint').hidden = !on; };
$('stage').addEventListener('dragenter', event => { event.preventDefault(); dragDepth += 1; dragging(true); });
$('stage').addEventListener('dragover', event => event.preventDefault());
$('stage').addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dragging(false); });
$('stage').addEventListener('drop', event => {
  event.preventDefault(); dragDepth = 0; dragging(false);
  const file = event.dataTransfer && event.dataTransfer.files[0];
  if (file) openFile(file);
});
['pointermove','pointerup','wheel','dblclick','keydown'].forEach(type => $('preview').addEventListener(type, updateView, { passive:true }));
sliders.forEach(key => $(key).addEventListener('input', schedule));
['autoLevels','invert'].forEach(key => $(key).addEventListener('input', schedule));
['foreground','background'].forEach(key => $(key).addEventListener('input', recolor));
$('sourceColors').addEventListener('change', () => {
  syncLabels();
  if (currentImage) render(); else recolor();
});
$('themeLight').addEventListener('click', () => setTheme('light'));
$('themeDark').addEventListener('click', () => setTheme('dark'));
$('resetColors').addEventListener('click', defaultColors);
function setMode(threeD) {
  if ($('threeD').checked === threeD) return;
  $('threeD').checked = threeD; syncLabels(); showModel();
}
$('mode2d').addEventListener('click', () => setMode(false));
$('mode3d').addEventListener('click', () => setMode(true));
['threeD','depth'].forEach(key => $(key).addEventListener('input', () => { syncLabels(); showModel(); }));
$('motion').addEventListener('change', setInteraction);
reducedMotion.addEventListener('change', event => {
  if (event.matches) { $('motion').checked = false; setInteraction(); }
});
$('reset').addEventListener('click', () => {
  sliders.forEach(key => { $(key).value = Halftone.defaults[key]; });
  ['foreground','background'].forEach(key => { $(key).value = ART[key]; });
  $('autoLevels').checked = true; $('invert').checked = false; $('motion').checked = true;
  $('sourceColors').checked = true;
  $('threeD').checked = true; $('depth').value = DEFAULT_DEPTH;
  if (cloud) { cloud.destroy(); cloud = null; } savedView = null;
  status('参数已重置'); schedule();
});
$('resetView').addEventListener('click', () => {
  if (cloud) { cloud.destroy(); cloud = null; } savedView = null; showModel();
});
$('sample').addEventListener('click', loadSample);
$('exportHtml').addEventListener('click', () => {
  const model = flush(); if (!model) return;
  saveBlob(new Blob([PointCloud.toHTML(model, cloudOptions())], {type:'text/html;charset=utf-8'}), 'point-cloud.html');
  status('点云 HTML 已生成，仅含画面和交互');
});
$('exportSvg').addEventListener('click', () => {
  const model = flush(); if (!model) return;
  saveBlob(new Blob([Halftone.toSVG(model)], { type:'image/svg+xml;charset=utf-8' }), 'dot-portrait.svg');
  status('交互 SVG 已生成，请用浏览器打开');
});
$('exportPng').addEventListener('click', () => {
  const model = flush(); if (!model || pngBusy) return;
  pngBusy = true; $('exportPng').disabled = true; status('正在生成 PNG…');
  if (cloud && $('threeD').checked) {
    try {
      cloud.snapshot(2).toBlob(blob => {
        if (blob) { saveBlob(blob, 'point-cloud.png'); status('点云 PNG 已生成（2 倍尺寸）'); }
        else status('PNG 生成失败，请重试。', true);
        pngBusy = false; $('exportPng').disabled = false;
      }, 'image/png');
    } catch (error) { status('PNG 导出失败：' + error.message, true); pngBusy = false; $('exportPng').disabled = false; }
    return;
  }
  const url = URL.createObjectURL(new Blob([Halftone.toSVG(model, { interactive:false })], { type:'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  const finish = () => { URL.revokeObjectURL(url); pngBusy = false; $('exportPng').disabled = false; };
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = model.width * 2; canvas.height = model.height * 2;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('画布不可用');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        if (blob) { saveBlob(blob, 'dot-portrait.png'); status('PNG 已生成（2 倍尺寸）'); }
        else status('PNG 生成失败，请先导出 SVG。', true);
        finish();
      }, 'image/png');
    } catch (error) { status('PNG 导出失败：' + error.message, true); finish(); }
  };
  img.onerror = () => { status('PNG 导出失败，请先导出 SVG。', true); finish(); };
  img.src = url;
});
window.addEventListener('pagehide', () => {
  if (destroyMotion) { destroyMotion(); destroyMotion = null; }
  if (cloud) { savedView = cloud.getView(); cloud.destroy(); cloud = null; }
  cancelAnimationFrame(renderFrame); renderFrame = 0;
});
window.addEventListener('pageshow', event => { if (event.persisted) showModel(); });
let savedTheme = 'dark';
try { savedTheme = window.localStorage.getItem('point-cloud-editor-theme') || 'dark'; } catch (_) {}
setTheme(savedTheme, false); syncLabels(); loadSample();
</script>
</body>
</html>
