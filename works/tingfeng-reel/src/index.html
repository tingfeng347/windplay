<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="tingfeng347 的动态作品片头：编码 Agent、RAG、Agent 编排与终端工具">
  <meta name="color-scheme" content="dark light">
  <title>Tingfeng Reel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="viewport" id="viewport">
    <div class="stage" id="stage" role="img" aria-label="tingfeng347 的动态作品演示">
      <canvas class="layer layer-back" data-layer="back"></canvas>
      <canvas class="layer layer-mid" data-layer="mid"></canvas>
      <canvas class="layer layer-front" data-layer="front"></canvas>
    </div>
  </main>

  <a class="back-link" href="../../../index.html">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
    <span>WindPlay</span>
  </a>

  <p class="sound-hint" id="sound-hint" hidden>点击 <b>声音</b> 开启配乐</p>

  <div class="controls" id="controls">
    <button class="icon-button" id="play" type="button" aria-label="暂停" title="播放 / 暂停（空格）">
      <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg>
      <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L13 8z"/></svg>
    </button>

    <div class="scrub">
      <div class="scrub-marks" id="marks" aria-hidden="true"></div>
      <input id="scrub" type="range" min="0" max="28000" step="10" value="0" aria-label="播放进度">
    </div>

    <span class="time" id="time">00:00 / 00:28</span>
    <span class="chapter" id="chapter">INTRO</span>

    <div class="segmented" role="group" aria-label="画面维度">
      <button type="button" data-dim="2d" aria-pressed="true" title="平面（D）">2D</button>
      <button type="button" data-dim="3d" aria-pressed="false" title="立体（D）">3D</button>
    </div>

    <button class="text-button" id="sound" type="button" aria-pressed="false" title="声音（M）">
      <svg class="icon-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5zM11 6l3.5 4M14.5 6 11 10"/></svg>
      <svg class="icon-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5zM11 5.5c1.3 1.3 1.3 3.7 0 5M12.8 3.8c2.3 2.3 2.3 6.1 0 8.4"/></svg>
      <span id="sound-label">声音 关</span>
    </button>

    <button class="icon-button" id="theme" type="button" aria-label="切换亮色 / 暗色" title="主题（T）">
      <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>
      <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>
    </button>

    <button class="icon-button" id="fullscreen" type="button" aria-label="全屏" title="全屏（F）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    </button>
  </div>

  <script src="timeline.js"></script>
  <script src="score.js"></script>
  <script src="models.js"></script>
  <script src="audio.js"></script>
  <script src="reel.js"></script>
</body>
</html>
