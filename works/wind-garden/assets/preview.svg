      <use href="#pluck" transform="translate(932 358)"/><use href="#pluck" transform="translate(1125 397)"/>
    </g>
    <g fill="none" stroke="url(#ribbon)" stroke-linecap="round">
      <path d="M126 373C263 331 309 407 459 373S749 344 929 378S1081 389 1199 354" stroke-width="1.8" opacity=".55"/>
      <path d="M116 466C242 449 373 496 514 462S759 439 976 469S1101 463 1211 445" stroke-width="1.2" opacity=".38"/>
      <path d="M265 539C403 510 495 552 630 530S840 509 1036 543" stroke-width="1.2" opacity=".45"/>
    </g>
    <g fill="#def1d4" opacity=".7">
      <circle cx="515" cy="353" r="2"/><circle cx="524" cy="415" r="1.8"/><circle cx="543" cy="481" r="1.8"/>
      <circle cx="512" cy="535" r="1.3"/><circle cx="542" cy="576" r="1.3"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#63877a" text-anchor="end" letter-spacing=".8">
