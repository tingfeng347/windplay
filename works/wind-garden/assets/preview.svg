  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#63877a" text-anchor="middle">
    <text x="158" y="649">01</text><text x="223" y="649">02</text><text x="287" y="649">03</text><text x="352" y="649">04</text>
    <text x="416" y="649">05</text><text x="481" y="649">06</text><text x="545" y="649">07</text><text x="610" y="649">08</text>
    <text x="674" y="649">09</text><text x="739" y="649">10</text><text x="803" y="649">11</text><text x="868" y="649">12</text>
    <text x="932" y="649">13</text><text x="997" y="649">14</text><text x="1061" y="649">15</text><text x="1125" y="649">16</text>
  </g>
  <g transform="translate(126 710)" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#38635b">
    <circle cy="-5" r="5" fill="#ddc57f"/><text x="16">风铃</text>
    <circle cx="104" cy="-5" r="5" fill="#e99982"/><text x="120">芦笛</text>
    <circle cx="208" cy="-5" r="5" fill="#81b9ce"/><text x="224">拨弦花</text>
