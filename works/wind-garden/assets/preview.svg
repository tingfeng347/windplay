    <text x="1159" y="175" font-size="11" text-anchor="end" letter-spacing="2">BPM</text>
  </g>
  <rect x="126" y="278" width="1032" height="358" rx="20" fill="#b1c8b5" opacity=".42"/>
  <rect x="126" y="271" width="1032" height="351" rx="20" fill="url(#garden)"/>
  <g clip-path="url(#plot)">
