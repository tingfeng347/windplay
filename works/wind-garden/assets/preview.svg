      <path d="M-2 7C-14 7-16-1-16-1C-8-4-3 0-2 7Z" fill="#7eac8d" stroke="none"/>
      <path d="M1 2C12 3 17-4 17-4C7-8 2-4 1 2Z" fill="#9abd93" stroke="none"/>
    </g>
    <g id="bell">
      <ellipse cy="15" rx="14" ry="4" fill="#0c2926" opacity=".25"/>
      <use href="#stem"/>
      <path d="M-13-17C-13-30-8-39 0-39S13-30 13-17C5-12-5-12-13-17Z" fill="#f3dfa0"/>
      <path d="M-13-17Q0-11 13-17" fill="none" stroke="#c5ae69" stroke-width="1.4"/>
      <path d="M0-16V-9" stroke="#d1ba76" stroke-width="2" stroke-linecap="round"/>
      <circle cy="-8" r="2.4" fill="#f7e9bc"/>
      <path d="M-5-31Q-9-26-9-20" fill="none" stroke="#fff2cb" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="reed">
      <ellipse cy="15" rx="13" ry="4" fill="#0c2926" opacity=".25"/>
      <use href="#stem"/>
      <path d="M0-19C-13-20-16-35-9-45C-4-38-2-29 0-19Z" fill="#ee9a84"/>
      <path d="M0-19C-4-36 3-46 9-45C17-35 10-24 0-19Z" fill="#f4b09a"/>
      <path d="M0-20C-4-31-2-42 2-49C9-43 8-30 0-20Z" fill="#ffd0aa"/>
      <path d="M0-23L2-40" fill="none" stroke="#d78371" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="pluck">
      <ellipse cy="15" rx="15" ry="4" fill="#0c2926" opacity=".25"/>
      <use href="#stem"/>
      <g fill="#93c8df" transform="translate(0 -28)">
        <ellipse cy="-8" rx="6" ry="10"/>
        <ellipse cy="-8" rx="6" ry="10" transform="rotate(72)"/>
        <ellipse cy="-8" rx="6" ry="10" transform="rotate(144)"/>
        <ellipse cy="-8" rx="6" ry="10" transform="rotate(216)"/>
        <ellipse cy="-8" rx="6" ry="10" transform="rotate(288)"/>
      </g>
      <circle cy="-28" r="5.2" fill="#e0edcc"/>
      <circle cy="-28" r="2" fill="#7cafa5"/>
    </g>
