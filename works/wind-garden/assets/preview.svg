  <rect width="1280" height="800" fill="url(#sky)"/>
  <ellipse cx="1050" cy="100" rx="440" ry="340" fill="url(#morning)"/>
  <g fill="none" stroke="#b1cfc1" opacity=".5">
    <path d="M-20 232C220 155 288 295 534 209S944 148 1300 202"/>
    <path d="M-20 242C212 166 296 303 540 219S953 157 1300 212"/>
  </g>
  <g font-family="Georgia, 'Songti SC', serif" fill="#204b47">
