<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">听风花园 / Wind Garden — 一座由风奏响的花园</title>
  <desc id="description">清晨的蓝绿色花园里，浅黄风铃、珊瑚色芦笛与蓝色拨弦花沿九行音阶、十六步节拍生长。柔软的风带从左向右穿过花丛。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#cce6e3"/><stop offset=".58" stop-color="#deece2"/><stop offset="1" stop-color="#edf0de"/></linearGradient>
    <radialGradient id="morning"><stop stop-color="#fff8dc" stop-opacity=".94"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient>
    <linearGradient id="garden" x2="0" y2="1"><stop stop-color="#234c49"/><stop offset="1" stop-color="#163b39"/></linearGradient>
    <linearGradient id="breeze"><stop stop-color="#d5f4e9" stop-opacity="0"/><stop offset=".38" stop-color="#d5f4e9" stop-opacity=".04"/><stop offset=".88" stop-color="#d5f4e9" stop-opacity=".16"/><stop offset="1" stop-color="#d5f4e9" stop-opacity="0"/></linearGradient>
    <linearGradient id="ribbon" x2="1" y2="0"><stop stop-color="#e5faea" stop-opacity="0"/><stop offset=".5" stop-color="#e5faea" stop-opacity=".8"/><stop offset="1" stop-color="#e5faea" stop-opacity="0"/></linearGradient>
    <clipPath id="plot"><rect x="126" y="271" width="1032" height="351" rx="20"/></clipPath>
    <g id="stem" fill="none" stroke-linecap="round">
