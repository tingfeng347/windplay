      <use href="#bell" transform="translate(416 397)"/><use href="#bell" transform="translate(545 436)"/>
      <use href="#bell" transform="translate(674 358)"/><use href="#bell" transform="translate(803 397)"/>
      <use href="#bell" transform="translate(932 475)"/><use href="#bell" transform="translate(1061 436)"/>
      <use href="#reed" transform="translate(223 592)"/><use href="#reed" transform="translate(416 553)"/>
      <use href="#reed" transform="translate(610 514)"/><use href="#reed" transform="translate(803 553)"/>
